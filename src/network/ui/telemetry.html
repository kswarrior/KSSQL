<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS SQL | Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .glass-sidebar { background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(16px); border-right: 1px solid #27272a; }
        .nav-item { padding: 10px 16px; border-radius: 8px; margin: 4px 12px; color: #a1a1aa; transition: all 0.2s; font-size: 0.875rem; }
        .nav-item:hover { background: #18181b; color: #fff; }
        .nav-item.active { background: #27272a; color: #fff; font-weight: 500; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; }
        .btn-primary { background: #f4f4f5; color: #09090b; font-weight: 500; border-radius: 8px; }
        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- MOBILE NAV -->
    <div id="mobile-nav" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden md:hidden">
        <div class="w-72 h-full glass-sidebar flex flex-col">
            <div class="p-8 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-100"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span class="text-xl font-bold tracking-tight">KS SQL</span>
                </div>
                <button onclick="toggleNav()" class="text-zinc-400"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <nav class="flex-grow mt-4">
                <a href="/" class="nav-item flex items-center gap-3">Terminal</a>
                <a href="/resilience" class="nav-item flex items-center gap-3">Resilience</a>
                <a href="/telemetry" class="nav-item active flex items-center gap-3">Telemetry</a>
            </nav>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-72 glass-sidebar flex flex-col hidden md:flex">
        <div class="p-8 flex items-center gap-3">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-100"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="text-xl font-bold tracking-tight">KS SQL</span>
        </div>
        <nav class="flex-grow mt-4">
            <a href="/" class="nav-item flex items-center gap-3">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
                Terminal
            </a>
            <a href="/resilience" class="nav-item flex items-center gap-3">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="20" y1="15" y2="15"/></svg>
                Resilience
            </a>
            <a href="/telemetry" class="nav-item active flex items-center gap-3">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Telemetry
            </a>
        </nav>
        <div class="p-6 border-t border-[#27272a] space-y-4">
            <input type="text" id="user" value="admin" class="w-full bg-black border border-[#27272a] rounded-lg p-2 text-xs text-zinc-400 outline-none focus:border-zinc-600">
            <input type="password" id="pass" value="admin" class="w-full bg-black border border-[#27272a] rounded-lg p-2 text-xs text-zinc-400 outline-none focus:border-zinc-600">
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-grow flex flex-col min-w-0">
        <header class="h-16 border-b border-[#27272a] flex items-center justify-between px-4 md:px-8 bg-[#09090b]/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <button onclick="toggleNav()" class="md:hidden text-zinc-400"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div class="text-sm font-medium text-zinc-400">System / <span class="text-zinc-100">Telemetry</span></div>
            </div>
            <div id="rps" class="text-xl font-bold tabular-nums">0 RPS</div>
        </header>
        <div class="flex-grow overflow-y-auto p-8 lg:p-12">
            <div class="max-w-6xl mx-auto space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="card p-6 space-y-6">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">CPU LOAD</span>
                        <svg width="100%" height="80" viewBox="0 0 400 80" preserveAspectRatio="none">
                            <path id="cpuPath" d="M0 80 L400 80" fill="rgba(244,244,245,0.05)" stroke="#f4f4f5" stroke-width="2" vector-effect="non-scaling-stroke" />
                        </svg>
                        <div class="flex justify-between text-xs font-mono">
                            <span class="text-zinc-500"><span id="cores">0</span> CORES</span>
                            <span id="load" class="text-white">0%</span>
                        </div>
                    </div>

                    <div class="card p-6 space-y-6">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">MEM FOOTPRINT</span>
                        <div class="h-20 flex flex-col justify-center">
                            <div id="memUsage" class="text-4xl font-bold">0 MB</div>
                            <div class="text-[10px] text-zinc-500 mt-1 uppercase">of <span id="memTotal">0 MB</span> peak</div>
                        </div>
                        <div class="h-1 bg-zinc-900 rounded-full overflow-hidden"><div id="memBar" class="h-full bg-white transition-all duration-500" style="width: 0%"></div></div>
                    </div>

                    <div class="card p-6 space-y-6">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">CACHE EFFICIENCY</span>
                        <div class="h-20 flex items-center justify-center">
                            <div id="hitRate" class="text-6xl font-bold text-zinc-100">0%</div>
                        </div>
                        <div class="h-1 bg-zinc-900 rounded-full overflow-hidden"><div id="hitBar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div></div>
                    </div>
                </div>

                <div class="card p-10 space-y-12 bg-zinc-900/10 border-blue-900/20">
                    <div class="flex flex-col md:flex-row justify-between md:items-center gap-8">
                        <div>
                            <h3 class="text-lg font-bold">Tiered Memory Controller</h3>
                            <p class="text-sm text-zinc-500">Tune the Adaptive In-Memory Acceleration Pipeline.</p>
                        </div>
                        <div class="flex items-center gap-4 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                            <span class="text-xs font-bold text-zinc-400 uppercase tracking-tighter">Redis Turbo</span>
                            <button id="turbo" class="w-12 h-6 bg-zinc-800 rounded-full p-1 relative transition-colors"><div id="thumb" class="w-4 h-4 bg-zinc-400 rounded-full transition-all"></div></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 items-center">
                        <div class="space-y-4">
                            <div class="flex justify-between text-xs font-bold text-zinc-500 uppercase"><span>RAM Limit</span><span id="limitLabel" class="text-zinc-100">1024 MB</span></div>
                            <input type="range" id="limitRange" min="128" max="16384" step="128" value="1024" class="w-full h-1 bg-zinc-800 rounded-full appearance-none accent-zinc-100">
                        </div>
                        <div class="text-center space-y-2">
                            <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">JET BUFFER</span>
                            <div id="jet" class="text-2xl font-bold">0 MB</div>
                        </div>
                        <button onclick="purge()" class="w-full py-4 border border-rose-900/50 text-rose-500 text-xs font-bold uppercase tracking-widest hover:bg-rose-900/10 rounded-xl transition-colors">Force Cache Purge</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleNav() { document.getElementById('mobile-nav').classList.toggle('hidden'); }
        let cpuHistory = Array(40).fill(0);
        function updateCpuPath() {
            const path = document.getElementById('cpuPath');
            const d = cpuHistory.map((v, i) => `${i === 0 ? 'M' : 'L'} ${(i/39)*400} ${80 - (v/100)*80}`).join(' ') + ' L 400 80 L 0 80 Z';
            path.setAttribute('d', d);
        }

        const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`);
        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.type === 'metric') {
                document.getElementById('load').innerText = `${msg.cpu_load}%`;
                document.getElementById('cores').innerText = msg.cpu_cores;
                document.getElementById('memUsage').innerText = `${msg.ram_usage} MB`;
                document.getElementById('memTotal').innerText = `${msg.ram_total} MB`;
                document.getElementById('memBar').style.width = `${(msg.ram_usage / msg.ram_total) * 100}%`;
                document.getElementById('rps').innerText = `${(msg.rps/1000).toFixed(1)}K RPS`;
                document.getElementById('hitRate').innerText = `${Math.round(msg.cache_hit_ratio)}%`;
                document.getElementById('hitBar').style.width = `${msg.cache_hit_ratio}%`;
                document.getElementById('jet').innerText = `${msg.jet_buffer_mb} MB`;
                cpuHistory.shift(); cpuHistory.push(msg.cpu_load); updateCpuPath();
                updateTurboUI(msg.redis_mode);
            }
        };

        function updateTurboUI(on) {
            const btn = document.getElementById('turbo');
            const thumb = document.getElementById('thumb');
            if(on) { btn.classList.replace('bg-zinc-800', 'bg-zinc-100'); thumb.classList.replace('bg-zinc-400', 'bg-zinc-900'); thumb.style.transform = 'translateX(24px)'; }
            else { btn.classList.replace('bg-zinc-100', 'bg-zinc-800'); thumb.classList.replace('bg-zinc-900', 'bg-zinc-400'); thumb.style.transform = 'translateX(0)'; }
        }

        const limitRange = document.getElementById('limitRange');
        limitRange.oninput = (e) => { document.getElementById('limitLabel').innerText = `${e.target.value} MB`; };
        limitRange.onchange = async (e) => {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            await fetch('/api/memory/limit', { method:'POST', headers:{'Authorization':`${user}:${pass}`}, body:JSON.stringify({limit_mb:parseInt(e.target.value)}) });
        };

        async function purge() {
            if(confirm("Confirm Cache Purge?")) {
                const user = document.getElementById('user').value;
                const pass = document.getElementById('pass').value;
                await fetch('/api/memory/purge', { method:'POST', headers:{'Authorization':`${user}:${pass}`} });
            }
        }
    </script>
</body>
</html>
