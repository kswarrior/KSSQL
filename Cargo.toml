[package]
name = "ks-sql"
version = "1.1.0"
edition = "2021"

[lib]
name = "ks_sql"
path = "src/lib.rs"

[[bin]]
name = "ks-core"
path = "src/bin/core/main.rs"

[[bin]]
name = "ks-worker"
path = "src/bin/worker/main.rs"

[[bin]]
name = "ks-dash"
path = "src/bin/dashboard/main.rs"

[dependencies]
sqlparser = { version = "0.43" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util", "macros", "time", "sync", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
anyhow = "1.0"
axum = { version = "0.7", features = ["ws", "http1", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
wasmi = "0.31"
crc32fast = "1.3"
dashmap = "5.5"
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
rand = "0.8"
crossbeam = "0.8"
libc = "0.2"
rcgen = "0.12"
async-trait = "0.1"
crossbeam-skiplist = "0.1.3"
itoa = "1.0.18"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
opt-level = 'z'
debug = false
