[package]
name = "ks-sql"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlparser = { version = "0.43" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util", "macros"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
opt-level = 'z'
debug = false
